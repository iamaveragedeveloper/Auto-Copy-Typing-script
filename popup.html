<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Copy Paste Typer</title>
  <style>
    :root { color-scheme: light dark; }
    body { width: 340px; margin: 0; padding: 12px; font: 13px/1.4 system-ui, sans-serif; }
    h1 { font-size: 14px; margin: 0 0 8px; }
    textarea { width: 100%; height: 130px; box-sizing: border-box; resize: vertical; font: inherit; padding: 6px; }
    label { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
    input[type=range] { flex: 1; }
    select { flex: 1; font: inherit; }
    .row { display: flex; gap: 8px; margin-top: 12px; }
    button { flex: 1; padding: 7px 0; font: inherit; cursor: pointer; }
    button.primary { font-weight: 600; }
    #status { min-height: 1.4em; margin-top: 8px; color: #c33; }
    .hint { margin-top: 8px; opacity: .65; font-size: 12px; }
  </style>
</head>
<body>
  <h1>Copy Paste Typer</h1>
  <textarea id="text" placeholder="Paste the text you want typed here…"></textarea>

  <label>
    <span>Mode</span>
    <select id="mode">
      <option value="char">Letter by letter (exact keystrokes)</option>
      <option value="line">Code editor: line by line (fixes auto-indent)</option>
    </select>
  </label>
  <label>
    <span>Delay</span>
    <input id="delay" type="range" min="0" max="300" step="5">
    <span id="delayVal"></span>
  </label>
  <label>
    <input id="jitter" type="checkbox"> Vary the timing randomly
  </label>
  <label>
    <span>Type into</span>
    <select id="target">
      <option value="auto">Any app, if the local typer is running</option>
      <option value="browser">This browser tab only</option>
    </select>
  </label>
  <div id="typerStatus" class="hint"></div>
  <label>
    <input id="showOnSelect" type="checkbox"> React when I highlight text
  </label>
  <label>
    <input id="autoStartOnHighlight" type="checkbox"> Start typing as soon as I highlight, without clicking the button (off = you confirm each time)
  </label>
  <label>
    <span>Start after</span>
    <input id="startDelay" type="number" min="0" max="10000" step="100" style="width:70px"> ms
  </label>

  <div class="row">
    <button id="type" class="primary">Type it</button>
    <button id="stop">Stop</button>
  </div>
  <div id="status"></div>
  <div class="hint">Click into the target field first. For code, click at the end of an empty editor. Chrome will show a "debugging this browser" bar while typing; that is expected. Esc or Alt+Q stops, and Alt+Q starts the saved text.</div>

  <script src="popup.js"></script>
</body>
</html>
